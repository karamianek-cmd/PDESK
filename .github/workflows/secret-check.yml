name: Secret check

on:
  push:
    branches:
      - client-builds
    paths:
      - .secret-check

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
      ANDROID_ALIAS: ${{ secrets.ANDROID_ALIAS }}
    steps:
      - name: Are the Android signing secrets visible to workflows? (names/lengths only)
        run: |
          echo "ANDROID_SIGNING_KEY length: ${#ANDROID_SIGNING_KEY}"
          echo "ANDROID_ALIAS length: ${#ANDROID_ALIAS}"
      - name: Expression check
        run: |
          echo "env != null  ->  ${{ env.ANDROID_SIGNING_KEY != null }}"
          echo "env != ''    ->  ${{ env.ANDROID_SIGNING_KEY != '' }}"
