name: Client builds (artifacts only)

# Runs when .build-trigger is changed on this branch (edit/touch that file to rebuild).
on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: Build Windows only
        type: boolean
        default: false
  push:
    branches:
      - client-builds
      - staff
    paths:
      - .build-trigger

permissions:
  contents: write

jobs:
  build-clients:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: "manual"
      windows-only: ${{ github.event.inputs.windows-only == 'true' }}
