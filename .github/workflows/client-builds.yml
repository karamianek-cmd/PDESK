name: Client builds (artifacts only)
# STAFF test builds: manual dispatch only

on:
  workflow_dispatch:
    inputs:
      windows-only:
        description: Build Windows only
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-clients:
    uses: ./.github/workflows/flutter-build.yml
    secrets: inherit
    permissions:
      contents: write
    with:
      upload-artifact: true
      upload-tag: "manual"
      windows-only: ${{ github.event.inputs.windows-only == 'true' }}
